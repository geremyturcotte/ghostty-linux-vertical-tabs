on:
  # push is restricted to the trunks, not every branch: a branch under a PR
  # already gets push+pull_request events on the same commit, which land in
  # the same concurrency group — cancel-in-progress kills whichever started
  # second AFTER it starts, and GitHub reports that as a `fail`, not a
  # no-op. Measured: PR #7 showed one `pass` and one `fail` for the same
  # commit, purely from this race, with a fully green build underneath.
  # Restricting push here means the duplicate never starts, so main/sidebar
  # still get push coverage for commits that land without a PR.
  # `sidebar` is deliberately NOT here while PR #6 is open, and this is the
  # second half of a fix whose first half is the comment above.
  #
  # Restricting push to the trunks was supposed to stop the duplicate. It does
  # -- for every branch except the one that is BOTH a trunk and the head of an
  # open PR. `sidebar` is exactly that. Measured on a859a98d8e:
  #
  #   pull_request run 32773714399 -> success
  #   push        run 32773711466 -> CANCELLED
  #
  # Same commit, same concurrency group (head_ref and ref_name are both
  # `sidebar`), cancel-in-progress kills whichever started first.
  #
  # That cancelled was harmless until a branch protection was added on `main`
  # requiring build-test-parity. The protection reads the check, sees
  # CANCELLED, and refuses the merge: PR #6 went from CLEAN to BLOCKED without
  # anything about the code changing. Two things that were each fine alone
  # became blocking together.
  #
  # `main` keeps its push coverage. `sidebar` loses nothing: while #6 is open
  # every commit on it already gets a pull_request run, which is the one that
  # survives the race and the one the protection reads.
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      cache_bust:
        description: >-
          Negative-control lever: any non-empty value is appended to every
          dependency cache key below, forcing a guaranteed miss without
          editing this file. Used to prove a cache can be absent and the
          job still downloads and passes (VERROUILLE condition 6) — never
          leave this set for a routine run.
        required: false
        default: ''

name: Fork CI

# Fork-only, additive workflow. Upstream's own Test workflow (test.yml) gates
# its jobs on `github.repository == 'ghostty-org/ghostty'` and runs on
# namespace-profile-* (upstream's paid fleet, unreachable from a fork — measured,
# not guessed). This workflow exists because that means the fork gets ZERO real
# CI: every push here shows green checks that never actually ran anything.
#
# Runs on ubuntu-latest only. Never touches test.yml, nix.yml, flatpak.yml, or
# update-colorschemes.yml — this file is the only surface a rebase can conflict
# on, and it conflicts on nothing because nothing upstream references it.
# github.ref is refs/heads/<branch> on push but refs/pull/<n>/merge on
# pull_request — two different groups for the same commit, so push and
# pull_request runs never dedupe against each other. head_ref (PR source
# branch, short name) falling back to ref_name (push, ALSO the short name —
# not ref, which is the long refs/heads/<branch> form and still wouldn't
# match head_ref) puts both events in the same group. Measured: without
# this, every commit ran the full ~10min build twice in parallel; the first
# version of this fix (head_ref || ref) only fixed it for pull_request and
# was verified wrong on push.
concurrency:
  group: fork-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --- Task 0 recipe (docs/vertical-tabs-plan.md), unmodified ---

      # Measured on run 32795128066 (main, fd8727d7c, 683s total): FIVE
      # network points cost 35s of that — apt 18s, Zig 8s, meson+ninja 5s,
      # this .deb 3s, blueprint 1s. zig build + zig build test are 82% of
      # the run; this is an AVAILABILITY change, not a speed one — a fork
      # with zero runners of its own goes down whenever one of these five
      # upstreams (ziglang.org, PyPI, GitLab, mkasberg/ghostty-ubuntu, or
      # Ubuntu's own mirrors) does, and CI has no way to tell "upstream is
      # down" from "this PR is broken". Caching four of the five removes
      # that shared failure surface; apt stays out on purpose (below).
      #
      # Each of the four below is cached in its own directory, keyed on its
      # pinned version. A cache miss (cold run, or key changed) MUST fall
      # back to the network step and still succeed — verified via
      # workflow_dispatch's cache_bust input, which busts every key at once
      # without touching this file. A cache HIT skips only the download/
      # build step, never the wiring step (PATH symlinks, GITHUB_PATH) that
      # every later step in this job depends on — so build correctness
      # never depends on which path was taken.

      - name: Install system dependencies
        # Deliberately NOT cached (fragility priority 5, last): apt sits on
        # Ubuntu's own package mirrors, already the most available network
        # dependency in this job, and it is the one step most likely to
        # need the newest packages ubuntu-latest ships — caching it risks
        # silently pinning against a mirror snapshot instead. Assumed, not
        # ignored: named here so the 18s and the choice are both visible.
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext pkg-config libgtk-4-dev libadwaita-1-dev gir1.2-adw-1 xvfb \
                                  python3-xlib python3-pil

      # Fragility priority 1: mkasberg/ghostty-ubuntu is a personal repo,
      # not an org/foundation-backed one, and it is the fork's own parity
      # baseline — losing it blocks every run, not just this step.
      - name: Cache ghostty upstream .deb (mkasberg/ghostty-ubuntu 1.3.1-0-ppa2)
        id: cache-ghostty-deb
        uses: actions/cache@v4
        with:
          path: /tmp/ghostty-upstream.deb
          key: ghostty-deb-1.3.1-0-ppa2${{ github.event.inputs.cache_bust }}

      - name: Download upstream ghostty .deb (parity baseline, cache miss)
        if: steps.cache-ghostty-deb.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ghostty-upstream.deb \
            https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.3.1-0-ppa2/ghostty_1.3.1-0.ppa2_amd64_24.04.deb

      # Installed here, not just before the parity check: measured on
      # ubuntu-latest, /usr/lib/libgtk4-layer-shell.so is NOT a stock file —
      # docs/vertical-tabs-plan.md's "orphaned .so, no package owns it" was
      # observed on a dev box that already had this same upstream .deb
      # installed. dpkg -S shows the .so is shipped BY the ghostty package
      # itself. The fork's own build needs it before `zig build` can link.
      - name: Install upstream ghostty 1.3.1 (parity baseline + gtk4-layer-shell.so)
        run: sudo apt-get install -y /tmp/ghostty-upstream.deb

      # Fragility priority 2: ziglang.org is a single-origin download with
      # no mirror this workflow falls back to.
      - name: Cache Zig 0.15.2
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/zig-0.15.2
          key: zig-0.15.2${{ github.event.inputs.cache_bust }}

      - name: Download Zig 0.15.2 (cache miss)
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/opt"
          cd /tmp
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig.tar.xz
          mv zig-x86_64-linux-0.15.2 "$HOME/.local/opt/zig-0.15.2"

      - name: Link Zig on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/.local/opt/zig-0.15.2/zig" "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fragility priority 4 (last of the four cached): PyPI is the most
      # available of the four, but still a network point — and caching the
      # venv here also skips the pip resolve, not just the download.
      - name: Cache meson 1.12.0 + ninja 1.13.0
        id: cache-meson-ninja
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/build-venv
          key: meson-1.12.0-ninja-1.13.0${{ github.event.inputs.cache_bust }}

      - name: Install meson + ninja (isolated venv — PEP 668, cache miss)
        if: steps.cache-meson-ninja.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$HOME/.local/opt/build-venv"
          "$HOME/.local/opt/build-venv/bin/pip" install --upgrade pip 'meson==1.12.0' 'ninja==1.13.0'

      - name: Link meson + ninja on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/.local/opt/build-venv/bin/meson" "$HOME/.local/bin/meson"
          ln -sf "$HOME/.local/opt/build-venv/bin/ninja" "$HOME/.local/bin/ninja"

      # Fragility priority 3: GitLab clone of a single upstream project —
      # caching this also skips the meson+ninja RECOMPILATION, not just the
      # git clone, which is most of this step's cost.
      - name: Cache blueprint-compiler 0.22.2
        id: cache-blueprint
        uses: actions/cache@v4
        with:
          path: ~/.local/opt/blueprint-0.22.2
          key: blueprint-0.22.2${{ github.event.inputs.cache_bust }}

      - name: Build blueprint-compiler 0.22.2 from source (apt ships 0.12.0 — too old, cache miss)
        if: steps.cache-blueprint.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp
          git clone --depth 1 --branch v0.22.2 https://gitlab.gnome.org/GNOME/blueprint-compiler.git
          cd blueprint-compiler
          meson setup _build --prefix="$HOME/.local/opt/blueprint-0.22.2"
          ninja -C _build install

      - name: Wire blueprint-compiler onto PATH + Python path
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/.local/opt/blueprint-0.22.2/bin/blueprint-compiler" "$HOME/.local/bin/blueprint-compiler"
          mkdir -p "$(python3 -m site --user-site)"
          echo "$HOME/.local/opt/blueprint-0.22.2/lib/python3/dist-packages" > "$(python3 -m site --user-site)/blueprintcompiler.pth"

      - name: Link gtk4-layer-shell (zig looks for -0.so, the .deb ships it unsuffixed)
        run: |
          mkdir -p "$HOME/.local/lib"
          ln -sf /usr/lib/libgtk4-layer-shell.so "$HOME/.local/lib/libgtk4-layer-shell-0.so"

      - name: zig build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          zig build --search-prefix "$HOME/.local"

      - name: zig build test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          zig build test --search-prefix "$HOME/.local"

      # --- parity gate: scripts/check-none-parity.sh, never called until now ---

      - name: check-none-parity.sh
        run: xvfb-run --auto-servernum -- sh scripts/check-none-parity.sh /usr/bin/ghostty

      # --- interface gate: what check-none-parity.sh structurally CANNOT see ---
      #
      # The step above compares LOGS. It returned SUCCESS on a commit where
      # Ctrl+Shift+B summoned a full sidebar in `gtk-sidebar-tabs=none` --
      # measured, 2026-08-24, run 32741694702. A log comparison cannot see an
      # interface defect, so its green proves the fork builds and its tests
      # pass; it proves NOTHING about `none` parity. That is the most
      # dangerous of the three states: a reader takes it for an answer.
      #
      # This step is the missing measurement, and it is narrow on purpose: it
      # only answers "is the sidebar really absent when it is disabled?".
      # Method, with a positive control in the SAME run: press Ctrl+Shift+B in
      # `left` mode (must change the sidebar column -- else the run refuses to
      # conclude), then the identical gesture in `none` mode (must change
      # nothing). The column width is MEASURED from the image, never assumed:
      # the frozen 260 was read off a window-managed 922x722 window, while
      # xvfb here gives 800x600 whose sidebar is 202px -- 58px of terminal
      # would otherwise be counted as sidebar.
      #
      # Proven to discriminate, same harness and display, one variable:
      #   binary before the fix -> exit 1, none-column diff 0.82780
      #   binary with the fix   -> exit 0, none-column diff 0.00000
      #   positive control identical in both: column measured x=202, 0.89281
      - name: none is really inert (interface, not logs)
        run: >-
          xvfb-run --auto-servernum --
          sh scripts/acceptance-abstain-gate.sh none-shortcut --
          python3 scripts/acceptance-harness.py --none-shortcut

      # --- CLIQUET D'ABSTENTION: scripts/acceptance-abstain-gate.sh ---
      #
      # acceptance-harness.py modes can exit 0 (PASS), 1 (FAIL), or 2
      # (CANNOT_MEASURE — the instrument couldn't set its own scene, not a
      # verdict on the product). A bare `python3 ... --mode` call in CI
      # cannot tell those apart: GitHub Actions marks ANY nonzero exit red,
      # so an abstention and a real failure look identical, and there was
      # no way to notice a mode abstaining forever without opening the log.
      #
      # scripts/acceptance-abstain-gate.sh restores that distinction against
      # scripts/acceptance-abstentions.txt, the versioned list of modes CI
      # currently permits to abstain (one line per mode, with a reason and a
      # follow-up chantier tag). It guards the LIST, not the verdict: a rc=1
      # is always red, and a listed mode that starts passing (rc=0 instead
      # of 2) is ALSO red — the entry is stale and must be removed, or the
      # ratchet is guarding nothing.
      #
      # --menu was the first mode wired through it: on the CI xvfb display
      # (800x600) its hamburger-click positive control used to miss (the
      # click coordinate was a constant frozen on a differently-sized
      # window) and it abstained (rc=2). Fixed by scanning the hamburger
      # button's position at runtime instead (HAMBURGER-calibration) -- and
      # no longer listed in scripts/acceptance-abstentions.txt.
      #
      # A second, separate false negative was found and fixed after that:
      # Session.measure_row_geometry's own band detector did not reunite a
      # row's title+subtitle sub-bands before counting rows, so on a window
      # with a single tab open (this mode's own scene -- it opens no tab
      # itself) the x-band it scans can return [header, title, subtitle] as
      # THREE separate bands with no row/header distinction, and the row-1
      # click landed on the header instead of the row. Confirmed on the
      # published v1.3.1-sidebar.3 archive (sha256 63caaf67...5a2ab),
      # cwd=repository root, window 800x600, under Xephyr: pre-fix rc=1
      # ("row-context-menu: confirmed ABSENT", click at y=93, the header's
      # own center); post-fix rc=0 (right-click at y=140, PROVEN inside row
      # 1's own measured span y=[126,155], header dropped) -- see
      # _merge_sidebar_row_bands's and cmd_menu's docstrings. This is not
      # "now passes everywhere" either: it is a row DETECTOR fix, not a
      # guarantee this x-band always resolves to a clean row/header split
      # on every geometry -- when it can't, this mode abstains (rc=2)
      # rather than guess, and scripts/acceptance-abstentions.txt is the
      # record of where that is currently expected. The gate above still
      # applies to any mode that IS listed there.
      - name: menu (row context menu, with positive+negative controls)
        run: >-
          xvfb-run --auto-servernum --
          sh scripts/acceptance-abstain-gate.sh menu --
          python3 scripts/acceptance-harness.py --menu
